<!DOCTYPE html>
<html>
<head>
    <script src="index.js"></script>
</head>
<style>
    body {
        color: white;
        padding: 0 16px;
    }

    .button-container {
        margin: 10px 0;
    }

    sp-divider {
        margin: 10px 0;
    }
</style>
<body>
<sp-heading>
    <h1>Amea Template App</h1>
</sp-heading>
<sp-body size="S" class="description">
    <p>Generate images from templates based on data from a xlsx-file</p>
</sp-body>
<sp-divider size="medium"></sp-divider>
<sp-body size="S">
    <div class="button-container">
        <sp-button variant="primary" id="btnInput">Select input (xlsx-file)</sp-button>
    </div>
    <div class="button-container">
        <sp-button variant="primary" id="btnOutput">Select output folder</sp-button>
    </div>
    <div class="button-container">
        <sp-button variant="secondary" id="btnTemplates">Select local templates folder</sp-button>
        <p>Select a local folder if you don't want to use templates in the cloud.</p>
    </div>
    <h4 class="spectrum-Heading--subtitle1">Output filetype</h4>
    <sp-radio-group
        name="export-type"
        vertical
    >
        <sp-radio checked value="png" size="m">PNG</sp-radio>
        <sp-radio value="psd" size="m">PSD</sp-radio>
    </sp-radio-group>
    <sp-divider size="medium"></sp-divider>
    <sp-button variant="cta" disabled id="btnGenerate">Generate</sp-button>
</sp-body>
<footer>
    v.1.3.0
</footer>
</body>
</html>
