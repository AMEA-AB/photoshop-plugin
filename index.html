<!DOCTYPE html>
<html>
<head>
    <script src="dist/index.js"></script>
</head>
<style>
    body {
        color: white;
        padding: 0 16px;
    }

    #btnOutput {
        margin-top: 10px;
    }

    sp-divider {
        margin: 10px 0;
    }
</style>
<body>
<sp-heading>
    <h1>Amea Template App</h1>
</sp-heading>
<sp-body size="S" class="description">
    <p>Generate images from templates based on data from a xlsx-file</p>
</sp-body>
<sp-body class="actions">
    <sp-button variant="primary" id="btnInput">Select input (xlsx-file)</sp-button>
    <sp-button quiet variant="primary" id="btnOutput">Select output folder</sp-button>
    <sp-button quiet variant="primary" id="btnTemplates">Select templates folder</sp-button>
    <sp-divider size="medium"></sp-divider>
    <sp-button variant="cta" disabled id="btnGenerate">Start generate</sp-button>
</sp-body>
<footer>
    v.1.0.0
</footer>
</body>
</html>
